# The monet React Native module package: one #[RustTurboModule("Monet")]
# wrapping monet-core's Client over the platform's native stack (URLSession
# on iOS, hyper+rustls + tungstenite on Android).
[package]
name = "monet-rn"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
# consumed by the app's aggregate library (built by react-native-rust-turbo)
crate-type = ["lib"]

# standalone on purpose: the framework crates below resolve through the
# consumer app's node_modules, which only exists there — keeping this crate
# out of the repo workspace avoids resolving them here.
# GENERATED-BY sync-vendor.sh (workspace section) — do not edit: the vendored crates inherit their
# `x.workspace = true` against these tables (copied verbatim from the repo
# root) when cargo binds them to this crate's [workspace] — see the script
# header for the two binding contexts.
[workspace]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
base64 = "0.22"
bytes = "1"
futures-channel = "0.3"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
futures-lite = "2"
indexmap = "2"
serde_json = "1"
thiserror = "2"
url = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
# the framework crates come from the core package's rust/ dir (a sibling
# in node_modules) — one copy in the cargo graph
jsi = { path = "../react-native-rust-turbo/rust/jsi", default-features = false, features = ["macros", "serde"] }
jsi-turbo = { path = "../react-native-rust-turbo/rust/jsi-turbo" }
linkme = "0.3"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }

# The monet crates ship vendored (vendor/ — rsynced from the repo's crates/
# by scripts/sync-vendor.sh; crates/ stays the single source of truth where
# the host tests and conformance batteries run). Path deps must stay inside
# this package: the aggregate build resolves them from node_modules.
monet-core = { path = "vendor/monet-core" }

# The smol-family executor drives the top-level futures. Every monet
# transport exposes runtime-agnostic BoxFutures (rustls/ws keep private
# tokio runtimes, urlsession has none), so this is the only executor needed.
async-global-executor = "2"
bytes.workspace = true
futures-channel.workspace = true
futures-lite = "2"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
# the native stack: URLSession HTTP, NWConnection WebSocket, system trust
monet-urlsession = { path = "vendor/monet-urlsession" }

[target.'cfg(target_os = "android")'.dependencies]
# The Android HTTP stack is a **deployment decision, expressed as cargo
# features** (the app picks by minSdk at build time — see platform.rs):
#
# - `httpengine` (default): the platform HttpEngine — the system Cronet,
#   framework API since 34, CTS-mandatory on every Android 14+ ROM, zero
#   app-shipped binary. Apps with minSdk >= 34 want exactly this.
# - `fallback-rustls` (optional): hyper+h2+rustls, for apps whose minSdk
#   is below 34 — at runtime the engine is preferred and rustls serves
#   the older devices. Disable on 34+ apps to keep hyper/h2 out of the
#   binary entirely.
# - `websocket` (default): monet-ws (tokio-tungstenite + rustls) —
#   HttpEngine has no WebSocket surface, so this is independent of the
#   HTTP choice.
monet-httpengine = { path = "vendor/monet-httpengine", optional = true }
# platform-verifier: the Android TLS trust goes through the platform trust
# store (rustls-platform-verifier; the embedder's bootstrap initializes its
# host settings — see src/bootstrap.rs), NOT the embedded Mozilla bundle
# that is the transports' own default. The npm package's Android library
# ships the verifier's JVM component (libs/), so every consumer's
# classloader can find it.
monet-rustls = { path = "vendor/monet-rustls", optional = true, features = [
  "platform-verifier",
] }
monet-ws = { path = "vendor/monet-ws", optional = true, features = [
  "platform-verifier",
] }
# The TlsTrust surface the transport configs are built with (vendored like
# the transports above).
monet-tls = { path = "vendor/monet-tls", features = ["platform-verifier"] }
log = "0.4"
# The bootstrap JNI entry (MonetBootstrap.nativeInit): present in every
# configuration — a no-op without the httpengine feature — so the Java
# side can call it unconditionally.
jni = "0.22"
# The bootstrap also initializes the Android platform verifier
# (rustls-platform-verifier's host settings: JVM + Context + class
# loader). monet-ws/monet-rustls connections with
# TlsTrust::PlatformVerifier cannot evaluate trust without it — every
# TLS handshake rejects with UnknownIssuer. Same 0.7 line as
# monet-tls's, so one crate instance resolves (the statics the
# verifier reads are the ones this init writes).
rustls-platform-verifier = "0.7"

[features]
default = ["httpengine", "websocket"]
httpengine = ["dep:monet-httpengine"]
fallback-rustls = ["dep:monet-rustls"]
websocket = ["dep:monet-ws"]
