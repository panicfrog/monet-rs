[workspace]
resolver = "3"
members = ["crates/monet-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
base64 = "0.22"
bytes = "1"
futures-channel = "0.3"
futures-core = "0.3"
futures-lite = "2"
indexmap = "2"
serde_json = "1"
thiserror = "2"
url = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
