[package]
name = "monet-ws"
description = "Pure-Rust WebSocket transport (tokio-tungstenite + rustls) for monet-core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["webpki-roots"]
# Forwarded to monet-tls.
platform-verifier = ["monet-tls/platform-verifier"]
webpki-roots = ["monet-tls/webpki-roots"]

[dependencies]
monet-core = { path = "../monet-core" }
monet-tls = { path = "../monet-tls", default-features = false }
bytes.workspace = true
futures-channel.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
futures-lite.workspace = true
tokio = { version = "1", features = ["rt", "sync", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net"] }

[lints]
workspace = true
