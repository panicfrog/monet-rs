[package]
name = "monet-cronet"
description = "Safe Cronet transport implementing monet-core's Transport for Android."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Forwarded to monet-cronet-sys: emit link directives for the real libcronet.
# Host test builds leave this off and link the fake from tests/fake instead.
link = ["monet-cronet-sys/link"]

[dependencies]
monet-core = { path = "../monet-core" }
monet-cronet-sys = { path = "../monet-cronet-sys" }
base64.workspace = true
bytes.workspace = true
futures-channel.workspace = true
futures-lite.workspace = true

[dev-dependencies]
futures-lite.workspace = true

[lints]
workspace = true
