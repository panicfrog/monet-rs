[package]
name = "monet-httpengine"
description = "Android platform HTTP transport (android.net.http.HttpEngine, API 34+) for monet-core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
monet-core = { path = "../monet-core" }
bytes.workspace = true
futures-channel.workspace = true
futures-lite.workspace = true
# Pin assembly and bridge wiring log here; the embedder's bootstrap
# installs the backend (android_logger on Android, env_logger/stderr
# in the host tests).
log = "0.4"
# The per-request head deadline races in Rust (Cronet has no timeout
# API) — jni.rs (Android-gated) awaits the Delay.
futures-timer = "3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[lints]
workspace = true
