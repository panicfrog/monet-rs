[package]
name = "monet-rustls"
description = "Pure-Rust HTTP transport (hyper + rustls) for monet-core: Android's default."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["webpki-roots"]
# Forwarded to monet-tls.
platform-verifier = ["monet-tls/platform-verifier"]
webpki-roots = ["monet-tls/webpki-roots"]

[dependencies]
monet-core = { path = "../monet-core" }
monet-tls = { path = "../monet-tls", default-features = false }
bytes.workspace = true
futures-channel.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
futures-lite.workspace = true
http = "1"
http-body-util = "0.1"
hyper = "1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "logging", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server", "http1", "http2", "tokio"] }
tokio = { version = "1", features = ["rt", "sync", "net"] }

[dev-dependencies]
monet-conformance = { path = "../monet-conformance" }
tokio = { version = "1", features = ["rt", "net"] }

[lints]
workspace = true
