[package]
name = "monet-demo"
description = "The on-device battery driver: same checks on a host test and inside the Android demo app."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# lib: host tests; cdylib: the Android app's JNI lib; staticlib: the iOS app.
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
monet-core = { path = "../monet-core" }
monet-conformance = { path = "../monet-conformance" }
monet-rustls = { path = "../monet-rustls", features = ["platform-verifier"] }
monet-tls = { path = "../monet-tls", features = ["platform-verifier"] }
monet-ws = { path = "../monet-ws", features = ["platform-verifier"] }
base64.workspace = true
bytes.workspace = true
futures-lite.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
monet-httpengine = { path = "../monet-httpengine" }
jni = "0.22"
rustls-platform-verifier = "0.7"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
monet-urlsession = { path = "../monet-urlsession" }

[lints]
workspace = true
