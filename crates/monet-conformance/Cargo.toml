[package]
name = "monet-conformance"
description = "Shared conformance suite driving any Transport/WebSocketTransport against local servers: one battery, every implementation."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
monet-core = { path = "../monet-core" }
monet-tls = { path = "../monet-tls", default-features = false }
base64.workspace = true
bytes.workspace = true
futures-channel.workspace = true
futures-lite.workspace = true
futures-timer = "3"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "net", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
tokio-tungstenite = "0.30"

[lints]
workspace = true
