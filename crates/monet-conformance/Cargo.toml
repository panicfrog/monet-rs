[package]
name = "monet-conformance"
description = "Shared conformance suite driving any Transport/WebSocketTransport against local servers: one battery, every implementation."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
monet-core = { path = "../monet-core" }
bytes.workspace = true
futures-channel.workspace = true
futures-lite.workspace = true
futures-timer = "3"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
tokio-tungstenite = "0.30"

[lints]
workspace = true
